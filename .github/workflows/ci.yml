name: Check Shelf formula

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: shelf-tap-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formula:
    name: Formula (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    steps:
      - name: Set up stable Homebrew and the current tap checkout
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
        with:
          stable: true
      - name: Check formula style
        run: brew style Formula/shelf.rb
      - name: Install the release archive through the formula
        run: brew install --build-from-source mcclowes/shelf/shelf
      - name: Run the formula tests
        run: brew test mcclowes/shelf/shelf
